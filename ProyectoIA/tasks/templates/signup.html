{% extends 'base.html' %}

{% block content %}
<div style="max-width: 400px; margin: 2rem auto; padding: 2rem; border: 1px solid #ccc; border-radius: 8px; background: #f9f9f9;">
    <h2 style="text-align: center;">Crear Cuenta</h2>

    {% if error %}
        <div style="color: red; margin-bottom: 1rem;">
            {{ error }}
        </div>
    {% endif %}

    <form action="/signup/" method="POST">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit" style="
            width: 100%;
            padding: 0.5rem;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 1rem;
        ">
            Registrarse
        </button>
    </form>

    <p style="text-align: center; margin-top: 1rem;">
        ¿Ya tienes cuenta?
        <a href="/signin/">Inicia sesión</a>
    </p>
</div>
{% endblock %}
